services:
  - type: web
    name: riskshield-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_EVENT_KEY
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
